[server]
listen = "127.0.0.1:8631"
spool_dir = "/var/spool/uniflow-ipp"

[tenant]
domain = ""
installer_name = "Linux IPP Client"
product_name = "uniFLOW IPP Server"
product_version = "1.0.0"

[cups]
queue_name = "uniflow_secure"
queue_display = "uniFLOW Secure Print"
use_ipp = true
ppd_path = "/usr/share/cups/model/uniflow-ipp.ppd"
share_queue = false

[cloud]
# Experimental, credential-provisioned upload. Disabled means local capture only.
enabled = false
management_server = ""
user_id = ""
token_path = "/var/lib/uniflow-ipp/token.json"
# Optional refresh credentials supplied by the tenant; no guessed identity provider.
oauth_client_id = ""
oauth_client_secret = ""
oauth_scope = ""
token_endpoint = ""
# Optional RFC 8628 provider support, NOT native SmartClient registration.
device_endpoint = ""