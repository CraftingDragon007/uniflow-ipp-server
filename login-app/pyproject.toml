[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniflow-login"
version = "1.0.0"
description = "Qt WebEngine tenant login and uniFLOW IPP server configuration"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "cryptography>=44",
]

[project.scripts]
uniflow-login = "uniflow_login.app:main"

[tool.setuptools.packages.find]
where = ["src"]
